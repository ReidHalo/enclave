<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enclave | Chat</title>
  <link rel="stylesheet" href="style.css">
  <!-- Import Supabase from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  
  <!-- LOGIN / REGISTER SCREEN -->
  <div id="auth-screen" class="auth-container">
    <div class="auth-box">
      <h2>Welcome to Enclave</h2>
      <p>Log in or create an account to start chatting.</p>
      
      <form id="auth-form">
        <input type="email" id="email-input" placeholder="Email" required>
        <input type="password" id="password-input" placeholder="Password" required>
        
        <!-- Only needed for registration -->
        <input type="text" id="username-input" placeholder="Username (for new accounts)" style="display: none;">
        <input type="url" id="avatar-input" placeholder="Profile Pic URL (for new accounts)" style="display: none;">
        
        <p id="auth-error" class="error-msg"></p>
        
        <button type="submit" id="login-btn">Log In</button>
        <button type="button" id="toggle-auth-btn" class="secondary-btn">Need an account? Sign Up</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP (Hidden until logged in) -->
  <div id="app-container" class="app-container" style="display: none;">
    <!-- We will put the 3-column chat layout here in the next step -->
    <h1>Logged in successfully! Loading chat...</h1>
    <button id="logout-btn">Log Out</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
